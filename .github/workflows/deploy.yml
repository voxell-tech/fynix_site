name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # tola-ssg commit the site is built with (0.8.0, Oct 12).
  TOLA_REV: 98f5c290da96192c8cb18704a51cf28d7285559a

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Built from a pinned commit: upstream's v0.8.0 tag has moved
      # since its release binaries were built, and those binaries can't
      # build this site. Cached, so it only compiles when TOLA_REV
      # changes.
      - name: Cache Tola
        id: tola-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tola
          key: tola-${{ env.TOLA_REV }}

      - name: Install Tola
        if: steps.tola-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/tola-rs/tola-ssg --rev "$TOLA_REV" tola

      - name: Install Tailwind CSS
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Build
        run: tola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
