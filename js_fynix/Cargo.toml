[package]
name = "js_fynix"
description = "Fynix in the browser: a DOM backend and the site's live demos, compiled to wasm."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# A released version, not a path or git dependency, so the site shows
# what people can depend on today.
fynix = "0.0.2"
# `#[element]` derives `Lenz`, whose output names this crate.
lenz = "0.1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "EventTarget",
    "HtmlElement",
    "Node",
    "PointerEvent",
    "Window",
] }

[profile.release]
opt-level = "s"
lto = true
